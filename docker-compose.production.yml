name: cloudwise

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudwise}
      POSTGRES_USER: ${POSTGRES_USER:-cloudwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudwise}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:6379:6379"]
    restart: always

  backend:
    image: cloudwise-backend:${CLOUDWISE_IMAGE_TAG:?CLOUDWISE_IMAGE_TAG is required}
    build:
      context: ./backend
      target: production
    env_file:
      - path: .env
        required: false
    volumes:
      - report-data:/var/lib/cloudwise/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    ports: ["127.0.0.1:8000:8000"]
    restart: always

  worker:
    image: cloudwise-backend:${CLOUDWISE_IMAGE_TAG:?CLOUDWISE_IMAGE_TAG is required}
    command: ["celery", "-A", "cloudwise.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    volumes:
      - report-data:/var/lib/cloudwise/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  scheduler:
    image: cloudwise-backend:${CLOUDWISE_IMAGE_TAG:?CLOUDWISE_IMAGE_TAG is required}
    command: ["celery", "-A", "cloudwise.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - path: .env
        required: false
    volumes:
      - report-data:/var/lib/cloudwise/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    image: cloudwise-frontend:${CLOUDWISE_IMAGE_TAG:?CLOUDWISE_IMAGE_TAG is required}
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:8080:8080"]
    restart: always

volumes:
  postgres-data:
  redis-data:
  report-data:
