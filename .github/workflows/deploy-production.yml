name: Deploy production to EC2

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Run deployment on EC2
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
      APPLICATION_BASE_URL: ${{ vars.APPLICATION_BASE_URL }}
      AWS_PAGER: ""

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          for value in AWS_REGION DEPLOY_SHA EC2_INSTANCE_ID EC2_DEPLOY_PATH; do
            test -n "${!value:-}" || {
              echo "Missing required production variable: ${value}"
              exit 1
            }
          done

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid deployment SHA"
            exit 1
          }

          [[ "$EC2_DEPLOY_PATH" == /* && "$EC2_DEPLOY_PATH" != / ]] || {
            echo "EC2_DEPLOY_PATH must be an absolute application directory"
            exit 1
          }

      - name: Debug OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # Print selected claims only. Never print the token itself.
          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key, '(not present)')}")

          expected_sub = "repo:bhati04/FinOPs-Project:environment:production"
          print(f"Expected trust-policy subject: {expected_sub}")

          if claims.get("sub") != expected_sub:
              print("::warning::Actual subject does not match the shared trust policy.")
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::354280291309:role/CloudWiseEC2Deployment
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: "354280291309"
          role-session-name: GitHubDeploy-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Fetch, build, migrate, and deploy on EC2
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          # Safely pass variable values into the remote Bash script.
          printf -v remote_header \
            'deploy_path=%q\ndeploy_sha=%q\napplication_base_url=%q\n' \
            "$EC2_DEPLOY_PATH" "$DEPLOY_SHA" "$APPLICATION_BASE_URL"

          remote_body=$(cat <<'SCRIPT'
          set -Eeuo pipefail

          cd "$deploy_path"
          test -f .env
          command -v git >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null
          docker compose version >/dev/null

          mkdir -p .deploy
          exec 9>.deploy/deployment.lock
          flock -n 9 || {
            echo "Another deployment is still running on EC2"
            exit 1
          }

          if [ -z "$application_base_url" ]; then
            imds_token=$(curl \
              --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --request PUT \
              --header 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
              http://169.254.169.254/latest/api/token)

            public_ip=$(curl \
              --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --header "X-aws-ec2-metadata-token: ${imds_token}" \
              http://169.254.169.254/latest/meta-data/public-ipv4)

            application_base_url="http://${public_ip}"
          fi

          application_base_url="${application_base_url%/}"

          sudo -u ubuntu -H git -C "$deploy_path" diff --quiet
          sudo -u ubuntu -H git -C "$deploy_path" diff --cached --quiet
          sudo -u ubuntu -H git -C "$deploy_path" fetch --prune origin "$deploy_sha"
          sudo -u ubuntu -H git -C "$deploy_path" checkout --detach "$deploy_sha"

          test -f docker-compose.production.yml

          previous_revision=$(cat .deploy/current-revision 2>/dev/null || true)

          # Best-effort image rollback only.
          # Does not undo database migrations or restore previous Compose files.
          rollback() {
            rc=$?
            trap - ERR

            if [ -n "$previous_revision" ]; then
              echo "Deployment failed; attempting previous application images"
              export CLOUDWISE_IMAGE_TAG="$previous_revision"
              export VITE_API_BASE_URL="${application_base_url}/api/v1"

              docker compose -f docker-compose.production.yml \
                up -d --no-build --no-deps \
                backend worker scheduler frontend \
                || echo "Image rollback failed; manual intervention required"
            else
              echo "No previous revision available for image rollback"
            fi

            exit "$rc"
          }

          trap rollback ERR

          export CLOUDWISE_IMAGE_TAG="$deploy_sha"
          export VITE_API_BASE_URL="${application_base_url}/api/v1"

          docker compose -f docker-compose.production.yml config --quiet

          docker compose -f docker-compose.production.yml \
            build --pull backend frontend

          docker compose -f docker-compose.production.yml \
            run --rm --no-deps backend alembic upgrade head

          docker compose -f docker-compose.production.yml \
            up -d --no-build --no-deps --remove-orphans \
            backend worker scheduler frontend

          docker compose -f docker-compose.production.yml ps

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --retry 12 --retry-delay 10 --retry-connrefused \
            http://127.0.0.1:8000/api/v1/health/live

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --retry 12 --retry-delay 10 --retry-connrefused \
            http://127.0.0.1:8000/api/v1/health/ready

          printf '%s\n' "$deploy_sha" > .deploy/current-revision
          trap - ERR
          SCRIPT
          )

          remote_script="${remote_header}${remote_body}"

          # SSM may use /bin/sh; explicitly execute our script with Bash.
          quoted_script=$(printf '%s' "$remote_script" | jq -Rs '@sh')

          parameters=$(jq -cn \
            --arg command "bash -c ${quoted_script}" \
            '{commands:[$command],executionTimeout:["2700"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 120 \
            --comment "Deploy CloudWise ${DEPLOY_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${command_id}"

          # Wait up to 50 minutes for the remote command.
          deadline=$((SECONDS + 3000))

          while (( SECONDS < deadline )); do
            if status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>ssm-poll-error.txt); then

              echo "Deployment status: ${status}"

              case "$status" in
                Success)
                  exit 0
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  ;;
                *)
                  echo "::error::SSM deployment ended with status ${status}"
                  exit 1
                  ;;
              esac
            else
              if ! grep -q 'InvocationDoesNotExist' ssm-poll-error.txt; then
                cat ssm-poll-error.txt >&2
                exit 1
              fi
            fi

            sleep 15
          done

          echo "::error::Polling timed out. Check SSM Run Command before retrying; deployment may still be running."
          exit 1

      - name: Show safe deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode}'
