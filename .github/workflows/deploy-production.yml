name: Deploy production to EC2

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Run deployment on EC2
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH }}
      APPLICATION_BASE_URL: ${{ vars.APPLICATION_BASE_URL }}
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for value in AWS_REGION DEPLOY_SHA EC2_INSTANCE_ID EC2_DEPLOY_PATH; do
            test -n "${!value:-}" || { echo "Missing required production variable: ${value}"; exit 1; }
          done

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch, build, migrate, and deploy on EC2
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          remote_script=$(cat <<SCRIPT
          set -Eeuo pipefail
          deploy_path='${EC2_DEPLOY_PATH}'
          deploy_sha='${DEPLOY_SHA}'
          application_base_url='${APPLICATION_BASE_URL}'
          cd "\${deploy_path}"
          test -f docker-compose.yml
          test -f .env
          command -v git >/dev/null
          command -v docker >/dev/null
          docker compose version >/dev/null
          if [ -z "\${application_base_url}" ]; then
            imds_token=\$(curl --fail --silent --show-error --request PUT --header 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
            public_ip=\$(curl --fail --silent --show-error --header "X-aws-ec2-metadata-token: \${imds_token}" http://169.254.169.254/latest/meta-data/public-ipv4)
            application_base_url="http://\${public_ip}"
          fi
          application_base_url="\${application_base_url%/}"
          sudo -u ubuntu -H git -C "\${deploy_path}" diff --quiet
          sudo -u ubuntu -H git -C "\${deploy_path}" diff --cached --quiet
          sudo -u ubuntu -H git -C "\${deploy_path}" fetch --prune origin "\${deploy_sha}"
          sudo -u ubuntu -H git -C "\${deploy_path}" checkout --detach "\${deploy_sha}"
          test -f docker-compose.production.yml
          mkdir -p .deploy
          previous_revision=\$(cat .deploy/current-revision 2>/dev/null || true)
          rollback() {
            if [ -n "\${previous_revision}" ]; then
              export CLOUDWISE_IMAGE_TAG="\${previous_revision}"
              export VITE_API_BASE_URL="\${application_base_url}/api/v1"
              docker compose -f docker-compose.production.yml up -d --no-build --no-deps backend worker scheduler frontend
            fi
          }
          trap rollback ERR
          export CLOUDWISE_IMAGE_TAG="\${deploy_sha}"
          export VITE_API_BASE_URL="\${application_base_url}/api/v1"
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.production.yml build --pull backend frontend
          docker compose -f docker-compose.production.yml run --rm --no-deps backend alembic upgrade head
          docker compose -f docker-compose.production.yml up -d --no-build --no-deps --remove-orphans backend worker scheduler frontend
          docker compose -f docker-compose.production.yml ps
          curl --fail --silent --show-error --retry 12 --retry-delay 10 http://127.0.0.1:8000/api/v1/health/live
          curl --fail --silent --show-error --retry 12 --retry-delay 10 http://127.0.0.1:8000/api/v1/health/ready
          printf '%s\n' "\${deploy_sha}" > .deploy/current-revision
          trap - ERR
          SCRIPT
          )
          parameters=$(jq -cn --arg command "${remote_script}" '{commands:[$command]}')
          command_id=$(aws ssm send-command --instance-ids "${EC2_INSTANCE_ID}" --document-name AWS-RunShellScript --comment "Deploy CloudWise ${DEPLOY_SHA}" --parameters "${parameters}" --query 'Command.CommandId' --output text)
          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}"
          status=$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --query Status --output text)
          test "${status}" = "Success"

      - name: Show safe deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        run: aws ssm get-command-invocation --command-id "${{ steps.deploy.outputs.command_id }}" --instance-id "${EC2_INSTANCE_ID}" --query '{Status:Status,ResponseCode:ResponseCode}'
